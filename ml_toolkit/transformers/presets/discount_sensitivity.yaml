# Пресет для модели чувствительности к скидке / предсказания размера скидки.
# 12 product-колонок, десятки миллионов строк -> набор сознательно минимальный:
# каждый трансформер добавлен под конкретную гипотезу, лишних окон/дублей нет.
# Итого 32 выходные колонки на product-колонку (384 кандидата на 12 колонок) -
# select_features дальше прогонит через correlation filter, это не финальный набор,
# а осознанно узкий список кандидатов, чтобы не тратить compute на Phase A впустую.
#
# Сегментация: клиент считается отточенным по колонке, если 8 последовательных
# месяцев подряд было 0 (zero_gap, gap_threshold=8). Подключена ТОЛЬКО к
# трансформерам уровня/тренда/волатильности значения - там долгий нулевой разрыв
# исказил бы сигнал (см. CLAUDE.md -> Segmentation). НЕ подключена к трансформерам
# активности (recency/tenure/inactive_streak/activity_rate/zero_share) - там сам
# разрыв и есть измеряемый сигнал, сегментация бы его стёрла.
#
# Заполнение NaN на gap-строках сегментированных трансформеров сюда не входит:
# у каждого трансформера свой дефолт заполнения лежит рядом с ним самим, в
# FILL_NAN его кернела (ml_toolkit/transformers/kernels/<name>.py) - применяется
# отдельно, вызовом fill_known_nan(df) уже ПОСЛЕ того как select_features/
# apply_selected_features отобрали и записали колонки (см. fill_known_nan в
# feature_generation.py). Из-за этого порядка корреляционный фильтр всегда
# видит настоящие NaN (корректно исключаются попарно), а не общий для всех
# сегментированных трансформеров сентинел - раньше (до переезда в кернелы)
# общий medium_gap у всех них означал бы одинаковое fill_nan-значение на одних
# и тех же gap-строках и завышал бы их взаимную корреляцию.

segments:
  medium_gap:
    strategy: zero_gap
    gap_threshold: 8   # 8 последовательных нулевых месяцев подряд = отток

# -----------------------------------------------------------------------------
# Текущее состояние / активность - основная гипотеза (наибольший вес в этом пресете)
# -----------------------------------------------------------------------------

segment_gap:               # явный флаг "клиент прямо сейчас в оттоке" по этой колонке
  segment: medium_gap

recency: {}                 # сколько месяцев назад была последняя активность (-1 = не было)

tenure: {}                  # стаж с первой активности + флаг самой первой точки

inactive_streak: {}         # текущая и исторически худшая серия простоя

activity_rate: {}           # доля активных месяцев с первой активности (общая "плотность")

zero_share:
  windows: [3, 12]          # недавняя (квартал) vs годовая плотность нулей - новый спад или хронический

# -----------------------------------------------------------------------------
# Уровень / тренд / волатильность значения - гипотеза "объём и траектория объясняют скидку"
# Сегментированы: отток (длинный ноль) не должен искажать эти метрики.
# -----------------------------------------------------------------------------

window_mean:
  windows: [3, 6, 12]
  segment: medium_gap        # простой интерпретируемый уровень - baseline рядом с log_level

window_median:
  windows: [3, 6, 12]
  segment: medium_gap        # устойчивая к выбросам версия уровня

rolling_min_max:
  windows: [3, 6, 12]
  segment: medium_gap        # диапазон разброса значения за период - простой интерпретируемый признак

log_level:
  windows: [3, 12]
  segment: medium_gap        # текущий масштаб vs годовой базовый уровень (лог-шкала, сравнима между колонками)

slope:
  windows: [3, 12]
  segment: medium_gap        # краткосрочный vs долгосрочный тренд

accel:
  segment: medium_gap        # ускоряется/тормозит ли динамика прямо сейчас (последняя точка)

growth_since_start:
  segment: medium_gap        # совокупный рост с начала текущего сегмента активности (не с начала жизни)

distance_to_global_max:
  segment: medium_gap        # насколько текущий уровень ниже пика ЭТОГО сегмента активности

rolling_cv:
  windows: [3, 12]
  segment: medium_gap        # нормированная волатильность - сравнима между колонками разного масштаба

extreme_share:
  windows: [12]
  segment: medium_gap        # доля/направление резких выбросов - гипотеза "промо-driven" поведения
