# Расширенный пресет для модели чувствительности к скидке / предсказания размера скидки.
# Надстройка над discount_sensitivity.yaml: та же гипотеза "текущее состояние важнее
# всего", плюс качество/устойчивость тренда, память ряда, фазы жизненного цикла,
# резкие сдвиги уровня. 65 колонок на product-колонку (780 на 12 колонок) -
# примерно в 2 раза больше кандидатов Phase A, чем базовый пресет.
#
# Тот же принцип сегментации: НЕ сегментируем то, что само описывает паттерн
# активности/разрывов (recency/tenure/inactive_streak/activity_rate/zero_share/
# active_run_count) - там разрыв и есть сигнал. Сегментируем всё, что описывает
# динамику ЗНАЧЕНИЯ - там долгий нулевой разрыв исказил бы сигнал.
#
# fill_nan: та же конвенция сентинелов, что в discount_sensitivity.yaml (см. его
# комментарий) - значение, заведомо невозможное для СОБСТВЕННОГО диапазона
# трансформера: -1 (гарантированно неотрицательные величины), -2 (величины,
# ограниченные корреляцией/долей), -999 (нормированные, но не строго ограниченные:
# z-score, счётчики, флаги), -999999 (величины на сыром масштабе колонки). Тот же
# компромисс с корреляционным фильтром применим при дальнейшей прогонке через
# select_features/corr_threshold - см. discount_sensitivity.yaml.

segments:
  short_gap:
    strategy: zero_gap
    gap_threshold: 3

# -----------------------------------------------------------------------------
# Текущее состояние / активность
# -----------------------------------------------------------------------------

segment_gap:
  segment: short_gap

recency: {}

tenure: {}

inactive_streak: {}

activity_rate: {}

zero_share:
  windows: [3, 12]

active_run_count:
  windows: [12]                # фрагментация активности: много коротких вспышек vs один long run

# -----------------------------------------------------------------------------
# Уровень / тренд / волатильность значения
# -----------------------------------------------------------------------------

window_mean:
  windows: [3, 6, 12]
  segment: short_gap           # простой интерпретируемый уровень
  fill_nan: -1

window_median:
  windows: [3, 6, 12]
  segment: short_gap           # устойчивая к выбросам версия уровня
  fill_nan: -1

rolling_min_max:
  windows: [3, 6, 12]
  segment: short_gap           # диапазон разброса значения за период
  fill_nan: -1

log_level:
  windows: [3, 12]
  segment: short_gap
  fill_nan: -1

slope:
  windows: [3, 12]
  segment: short_gap
  fill_nan: -999999

accel:
  segment: short_gap
  fill_nan: -999999

growth_since_start:
  segment: short_gap
  fill_nan: -2

distance_to_global_max:
  segment: short_gap
  fill_nan: -2

cumulative_share:
  segment: short_gap           # доля текущей точки в накопленной сумме текущего сегмента активности
  fill_nan: -1                  # v/|cumsum| >= 0 всегда (значения неотрицательны)

rolling_cv:
  windows: [3, 12]
  segment: short_gap
  fill_nan: -1

rolling_std:
  windows: [3, 12]
  segment: short_gap           # абсолютная волатильность рядом с нормированной CV - для
                                # предсказания РАЗМЕРА скидки масштаб может быть важен сам по себе
  fill_nan: -1                  # std >= 0 всегда, независимо от масштаба колонки

# -----------------------------------------------------------------------------
# Память / качество тренда / структурные сдвиги - новое относительно базового пресета
# -----------------------------------------------------------------------------

autocorr:
  segment: short_gap           # инерционность/предсказуемость динамики (лаги 1/2/3/6/12)
  fill_nan: -2                  # все выходы - Pearson r в [-1,1], -2 недостижим

trend_consistency:
  windows: [12]
  segment: short_gap           # тренд - устойчивый сигнал или шум (R², clean_streak)
  fill_nan: -999                # смесь долей [0,1] и не строго ограниченных noise_signal/r_squared

regime_change:
  windows: [12]
  segment: short_gap           # резкий сдвиг уровня - возможный маркер пересмотра условий
  fill_nan: -999                # magnitude/late_vs_early/asymmetry в единицах σ, без жёсткой границы

lifecycle_phase:
  windows: [12]
  segment: short_gap           # фаза (разгон/зрелость/спад) - разная фаза = разная позиция в переговорах
  fill_nan: -999999             # post_peak_slope_w12 на сыром масштабе колонки

extreme_events:
  windows: [12]
  segment: short_gap           # заменяет extreme_share базового пресета: та же гипотеза
                                # "промо-driven всплески", но с разбивкой на всплеск/обвал/давность
  fill_nan: -999                # смесь счётчиков/z-score/флагов, без единой строгой границы
